server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /credits {
    alias /usr/share/nginx/html/credits/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache";
  }

  location = /credits/ { return 308 /credits; }
  location = /credits/index.html { return 308 /credits; }

  location ~* \.(?:html|json|xml|txt|webmanifest|ico)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~ ^/assets/index-[A-Za-z0-9_-]+\.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|glb|gltf|bin|jpg|jpeg|png|webp|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
  }
}
